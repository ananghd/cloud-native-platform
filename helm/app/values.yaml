replicaCount: 2

image:
  repository: ghcr.io/your-org/cloud-native-platform
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: app.example.com
  tlsSecret: app-tls

serviceAccount:
  create: true
  name: app
  roleArn: ""

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
